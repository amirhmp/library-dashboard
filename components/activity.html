<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کامپوننت: فعالیت‌های اخیر</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="font-body min-h-screen max-w-sm bg-surface p-6 text-ink dark:bg-surface-dark dark:text-ink-inverse">

  <!-- ================= COPY FROM HERE ================= -->

  <div class="card">
    <h2 class="mb-4 font-display text-lg font-semibold">فعالیت‌های اخیر</h2>

    <ul class="divide-y divide-primary-50 dark:divide-white/5">
      <li class="flex gap-3 py-3 first:pt-0 last:pb-0">
        <span class="icon-chip size-9 shrink-0 bg-success-soft text-success dark:bg-success/15 dark:text-emerald-300">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="M4 12.5l4.5 4.5L20 6" />
          </svg>
        </span>
        <div class="min-w-0">
          <p class="text-sm"><span class="font-medium">بوف کور</span> توسط جواد کریمی بازگردانده شد</p>
          <p class="text-xs text-ink-muted">۲ ساعت پیش</p>
        </div>
      </li>

      <li class="flex gap-3 py-3 first:pt-0 last:pb-0">
        <span class="icon-chip size-9 shrink-0 bg-primary-50 text-primary-600 dark:bg-white/5 dark:text-primary-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <circle cx="9" cy="8" r="3" />
            <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
          </svg>
        </span>
        <div class="min-w-0">
          <p class="text-sm">عضو جدید ثبت‌نام کرد: <span class="font-medium">پریسا شریفی</span></p>
          <p class="text-xs text-ink-muted">۵ ساعت پیش</p>
        </div>
      </li>

      <li class="flex gap-3 py-3 first:pt-0 last:pb-0">
        <span class="icon-chip size-9 shrink-0 bg-danger-soft text-danger dark:bg-danger/15 dark:text-rose-300">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="M6 10.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14.5 6 10.5Z" />
            <path d="M10 19a2 2 0 0 0 4 0" />
          </svg>
        </span>
        <div class="min-w-0">
          <p class="text-sm">یادآوری دیرکرد برای <span class="font-medium">«سووشون»</span> ارسال شد</p>
          <p class="text-xs text-ink-muted">۱ روز پیش</p>
        </div>
      </li>

      <li class="flex gap-3 py-3 first:pt-0 last:pb-0">
        <span class="icon-chip size-9 shrink-0 bg-secondary-100 text-secondary-600 dark:bg-secondary-500/15 dark:text-secondary-300">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="M12 6c-1.5-1.3-3.6-2-6-2v13c2.4 0 4.5.7 6 2 1.5-1.3 3.6-2 6-2V4c-2.4 0-4.5.7-6 2Z" />
            <line x1="12" y1="6" x2="12" y2="19" />
          </svg>
        </span>
        <div class="min-w-0">
          <p class="text-sm"><span class="font-medium">«همسایه‌ها»</span> به فهرست کتاب‌ها اضافه شد</p>
          <p class="text-xs text-ink-muted">۲ روز پیش</p>
        </div>
      </li>
    </ul>
  </div>

  <!-- ================= COPY TO HERE ================= -->

</body>
</html>
