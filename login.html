<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود — قفسه</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body
    class="font-body relative flex min-h-screen items-center justify-center bg-surface p-6 text-ink dark:bg-surface-dark dark:text-ink-inverse"
  >
    <button
      data-theme-toggle
      type="button"
      class="btn-icon absolute start-4 top-4 border border-primary-100 bg-white dark:border-white/10 dark:bg-surface-dark-muted"
      aria-label="تغییر حالت روشن/تاریک"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        class="size-5 hidden dark:block"
      >
        <circle cx="12" cy="12" r="4" />
        <line x1="12" y1="2.5" x2="12" y2="5" />
        <line x1="12" y1="19" x2="12" y2="21.5" />
        <line x1="2.5" y1="12" x2="5" y2="12" />
        <line x1="19" y1="12" x2="21.5" y2="12" />
        <line x1="5" y1="5" x2="6.8" y2="6.8" />
        <line x1="17.2" y1="17.2" x2="19" y2="19" />
        <line x1="19" y1="5" x2="17.2" y2="6.8" />
        <line x1="6.8" y1="17.2" x2="5" y2="19" />
      </svg>
      <svg viewBox="0 0 24 24" fill="currentColor" class="size-5 dark:hidden">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
      </svg>
    </button>

    <div class="card w-full max-w-sm">
      <div class="mb-6 flex flex-col items-center text-center">
        <span
          class="mb-3 flex size-12 items-center justify-center rounded-xl bg-primary-700 text-secondary-400"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-6"
          >
            <path
              d="M12 6c-1.5-1.3-3.6-2-6-2v13c2.4 0 4.5.7 6 2 1.5-1.3 3.6-2 6-2V4c-2.4 0-4.5.7-6 2Z"
            />
            <line x1="12" y1="6" x2="12" y2="19" />
          </svg>
        </span>
        <h1 class="font-display text-xl font-semibold">پنل مدیریت قفسه</h1>
        <p class="mt-1 text-sm text-ink-muted">
          برای مدیریت کتابخانه وارد شوید
        </p>
      </div>

      <form class="space-y-4">
        <div>
          <label for="email" class="field-label">ایمیل</label>
          <div class="relative">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="pointer-events-none absolute start-3 top-1/2 size-4.5 -translate-y-1/2 text-ink-muted"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <input
              id="email"
              type="email"
              class="input-search"
              placeholder="shoma@ketabkhaneh.ir"
            />
          </div>
        </div>

        <div>
          <label for="password" class="field-label">رمز عبور</label>
          <div class="relative">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="pointer-events-none absolute start-3 top-1/2 size-4.5 -translate-y-1/2 text-ink-muted"
            >
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              id="password"
              type="password"
              class="input-search"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-ink-muted">
            <input
              type="checkbox"
              class="size-4 rounded border-primary-300 accent-primary-600"
            />
            مرا به خاطر بسپار
          </label>
          <a
            href="#"
            class="font-medium text-primary-600 hover:underline dark:text-secondary-400"
            >رمز عبور را فراموش کرده‌اید؟</a
          >
        </div>

        <button type="submit" class="btn-primary w-full">ورود</button>
      </form>

      <p class="mt-6 text-center text-xs text-ink-muted">
        این یک پروژه نمایشی است — فرم به‌جایی ارسال نمی‌شود.
      </p>
    </div>
  </body>
</html>
